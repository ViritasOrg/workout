name: Version Bump

on:
  push:
    branches: [main]

concurrency:
  group: version-bump
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node tests/test_frontend.js index.html

      - name: Bump version
        run: |
          CURRENT=$(jq -r '.version' version.json)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW="${MAJOR}.$((MINOR + 1))"

          echo "{\"version\": \"${NEW}\"}" > version.json
          sed -i "s/const VERSION='[0-9.]*'/const VERSION='${NEW}'/" index.html

          echo "NEW=${NEW}" >> $GITHUB_ENV

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json index.html
          git commit -m "chore: bump to v${{ env.NEW }} [skip ci]"
          git push
